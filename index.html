<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>معرض الصور</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{ background:#0a1e3d; font-family: Tahoma, "Segoe UI", sans-serif; padding:24px; min-height:100vh; }
  .grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; max-width:1200px; margin:0 auto; }
  .cell{ position:relative; display:block; border-radius:14px; overflow:hidden; aspect-ratio:1/1; text-decoration:none; border:1px solid rgba(232,163,61,.25); }
  .cell img{ width:100%; height:100%; object-fit:cover; display:block; transition:transform .3s ease, filter .3s ease; }
  .cell:hover img{ transform:scale(1.04); filter:brightness(1.05); }
  .badge{ position:absolute; top:10px; left:10px; background:rgba(13,27,42,.75); color:#e8a33d; font-size:12px; padding:5px 10px; border-radius:999px; border:1px solid rgba(232,163,61,.35); pointer-events:none; }
</style>
</head>
<body>
  <div class="grid">
      <a class="cell" href="videos/file0-1-2026-04-25_01-2-.mp4" target="_blank" rel="noopener"><span class="badge">🎬 فيديو</span><img src="images/img0-4.png" alt=""></a>
  </div>
</body>
</html>
